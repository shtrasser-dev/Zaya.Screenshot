name: Publish

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Release notes (shown on GitHub Releases; optional)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: windows-2022
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build plugin & NuGet
        run: .\build.cmd

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: out/*.nupkg
          retention-days: 1

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            out/*.zip
            out/version.txt
            out/channel.txt
            out/plugins.versions.txt
            out/interfaces.json
          retention-days: 1

  publish-github:
    needs: build
    if: contains(github.server_url, 'github.com')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push packages/*.nupkg \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

  publish-gitverse:
    needs: build
    if: contains(github.server_url, 'gitverse.ru')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Push to GitVerse Packages
        run: |
          dotnet nuget push packages/*.nupkg \
            --source https://gitverse.ru/api/packages/${{ github.repository_owner }}/nuget/index.json \
            --api-key ${{ secrets.NUGET_TOKEN }} \
            --skip-duplicate

  publish-nuget:
    needs: build
    if: contains(github.server_url, 'github.com')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: shtrasser

      - name: Push to NuGet.org
        run: |
          dotnet nuget push packages/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  create-release:
    needs: build
    if: contains(github.server_url, 'github.com')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: plugin

      - uses: actions/github-script@v7
        env:
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const versionsPath = 'plugin/plugins.versions.txt';
            let assetVersions = [];
            if (fs.existsSync(versionsPath)) {
              assetVersions = fs.readFileSync(versionsPath, 'utf8')
                .split(/\r?\n/)
                .map(l => l.trim())
                .filter(Boolean);
            }

            const interfacesPath = 'plugin/interfaces.json';
            if (!fs.existsSync(interfacesPath)) {
              core.setFailed('Missing interfaces.json (one floating release per interface).');
              return;
            }

            const groups = JSON.parse(fs.readFileSync(interfacesPath, 'utf8'));
            if (!Array.isArray(groups) || groups.length === 0) {
              core.setFailed('interfaces.json is empty');
              return;
            }

            async function createOrReplaceRelease(tagName, name, releaseBody, zipFiles, makeLatest) {
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: tagName,
                });
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.data.id,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tagName}`,
                });
              } catch (e) {
                if (e.status !== 404 && e.status !== 422) throw e;
              }

              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name,
                body: releaseBody,
                make_latest: makeLatest ? 'true' : 'false',
                generate_release_notes: false,
              });

              for (const zipFile of zipFiles) {
                const zipPath = path.join('plugin', zipFile);
                if (!fs.existsSync(zipPath)) {
                  core.setFailed(`Missing asset ${zipFile} for ${tagName}`);
                  return;
                }
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.data.id,
                  name: zipFile,
                  data: fs.readFileSync(zipPath),
                });
              }
            }

            // One immutable + one floating tag per interface package.
            let first = true;
            for (const g of groups) {
              const iface = g.interface;
              const channel = g.channel;
              const version = g.version;
              const zipFiles = g.assets || [];
              if (!iface || !channel || !version || zipFiles.length === 0) {
                core.setFailed(`Invalid interfaces.json entry: ${JSON.stringify(g)}`);
                return;
              }

              const tag = `plugin-${iface}-v${version}`;
              const latestTag = `plugin-${iface}-v${channel}-latest`;
              const releaseName = `${iface} plugins v${version}`;
              const changelog = (process.env.RELEASE_CHANGELOG || '').trim();
              const meta = [
                `interface: ${iface}`,
                `version: ${version}`,
                `interfaceChannel: ${channel}`,
                '',
                ...assetVersions.filter(line => zipFiles.some(z => line.startsWith(z + '='))),
                '',
                `Plugin release for ${iface} (channel ${channel}).`,
                '',
                'Assets:',
                ...zipFiles.map(f => `- \`${f}\``),
              ].join('\n');
              const body = changelog ? `${changelog}\n\n---\n\n${meta}` : meta;

              await createOrReplaceRelease(tag, releaseName, body, zipFiles, first);
              await createOrReplaceRelease(latestTag, releaseName, body, zipFiles, false);
              first = false;
            }
